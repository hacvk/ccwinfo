<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="row[id]" value="{$row.id|htmlentities}">
    <div class="form-group">
        <label for="c-code" class="control-label col-xs-12 col-sm-2">编码(code):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-code" data-rule="required" class="form-control" name="row[code]" type="text" value="{$row.code|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="{$row.name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-type" class="control-label col-xs-12 col-sm-2">类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-type" class="form-control selectpicker" name="row[type]">
                {foreach name="typeList" item="vo" key="k"}
                <option value="{$k|htmlentities}" {eq name="row.type" value="$k"}selected{/eq}>{$vo|htmlentities}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="c-max_items" class="control-label col-xs-12 col-sm-2">最多条数:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-max_items" class="form-control" name="row[max_items]" type="number" value="{$row.max_items|htmlentities}">
        </div>
    </div>
    <input id="c-config" class="form-control" name="row[config]" type="hidden" value="{$row.config|htmlentities}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">周/月/季价格:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="row">
                <div class="col-xs-4">
                    <div class="input-group">
                        <input id="cfg-price-week" class="form-control" type="number" min="0" step="0.01" value="0">
                        <span class="input-group-addon">周</span>
                    </div>
                </div>
                <div class="col-xs-4">
                    <div class="input-group">
                        <input id="cfg-price-month" class="form-control" type="number" min="0" step="0.01" value="0">
                        <span class="input-group-addon">月</span>
                    </div>
                </div>
                <div class="col-xs-4">
                    <div class="input-group">
                        <input id="cfg-price-quarter" class="form-control" type="number" min="0" step="0.01" value="0">
                        <span class="input-group-addon">季</span>
                    </div>
                </div>
            </div>
            <span class="help-block">单位：元。规则固定为周=7天，月=30天，季=90天。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">动态字段JSON:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="cfg-form-fields" class="form-control" rows="8" placeholder='[{"name":"title","label":"推广标题","type":"text","required":1,"maxlength":80}]'></textarea>
            <span class="help-block">字段类型仅支持 text/url/textarea/number/select/image；select 可带 options 数组。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', $statusList, $row.status)}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
