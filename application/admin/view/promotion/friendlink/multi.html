<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        <div class="panel-title">批量审核友情链接</div>
    </div>
    <div class="panel-body">
        <form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
            {:token()}
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">审核状态<span class="text-danger">*</span>:</label>
                <div class="col-xs-12 col-sm-8">
                    <select name="params[row][review_status]" class="form-control selectpicker" data-rule="required">
                        <option value="">请选择审核状态</option>
                        <option value="approved">通过</option>
                        <option value="rejected">拒绝</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">审核备注:</label>
                <div class="col-xs-12 col-sm-8">
                    <textarea name="params[row][review_remark]" class="form-control" rows="3" placeholder="请输入审核备注（可选）"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2"></label>
                <div class="col-xs-12 col-sm-8">
                    <button type="submit" class="btn btn-success btn-embossed">{:__('OK')}</button>
                    <button type="button" class="btn btn-default btn-embossed" onclick="history.back(-1)">{:__('Back')}</button>
                </div>
            </div>
        </form>
    </div>
</div>
