<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label for="c-slot_id" class="control-label col-xs-12 col-sm-2">展示位:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-slot_id" data-rule="required" class="form-control selectpicker" name="row[slot_id]">
                <option value="">请选择展示位</option>
                {foreach name="slotList" item="vo" key="k"}
                <option value="{$k|htmlentities}">{$vo|htmlentities}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="c-category_id" class="control-label col-xs-12 col-sm-2">所属分类(可选):</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-category_id" class="form-control selectpicker" name="row[category_id]">
                <option value="0">不限分类</option>
                {foreach name="categoryList" item="vo" key="k"}
                <option value="{$k|htmlentities}">{$vo|htmlentities}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="c-page_scope" class="control-label col-xs-12 col-sm-2">展示范围:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-page_scope" class="form-control selectpicker" name="row[page_scope]">
                <option value="all">全站</option>
                <option value="home">首页</option>
                <option value="category">栏目页</option>
                <option value="channel">频道页</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="c-title" class="control-label col-xs-12 col-sm-2">标题/链接文字:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-link_url" class="control-label col-xs-12 col-sm-2">跳转URL:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-link_url" class="form-control" name="row[link_url]" type="text" value="" placeholder="可选，留空仅展示文字/图片不跳转">
        </div>
    </div>
    <div class="form-group">
        <label for="c-image" class="control-label col-xs-12 col-sm-2">图片(可选):</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image" class="form-control" name="row[image]" type="text" value="">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" class="btn btn-danger faupload" data-input-id="c-image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" class="btn btn-primary fachoose" data-input-id="c-image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right"></span>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label for="c-start_time" class="control-label col-xs-12 col-sm-2">开始时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-start_time" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" name="row[start_time]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-end_time" class="control-label col-xs-12 col-sm-2">结束时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-end_time" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" name="row[end_time]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-sort" class="control-label col-xs-12 col-sm-2">排序权重:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sort" class="form-control" name="row[sort]" type="number" value="0">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">投放状态:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', $statusList, 'draft')}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">审核状态:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[review_status]', $reviewStatusList, 'pending')}
        </div>
    </div>
    <div class="form-group">
        <label for="c-contact_name" class="control-label col-xs-12 col-sm-2">联系人:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contact_name" class="form-control" name="row[contact_name]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-contact_mobile" class="control-label col-xs-12 col-sm-2">联系电话:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contact_mobile" class="form-control" name="row[contact_mobile]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-company_name" class="control-label col-xs-12 col-sm-2">公司名称(可选):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-company_name" class="form-control" name="row[company_name]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-review_remark" class="control-label col-xs-12 col-sm-2">审核备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-review_remark" class="form-control" name="row[review_remark]" rows="3"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
