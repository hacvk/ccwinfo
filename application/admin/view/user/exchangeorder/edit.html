<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Order_no')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.order_no|htmlentities}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('User_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.user_id|htmlentities}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label for="c-order_status" class="control-label col-xs-12 col-sm-2">{:__('Order_status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-order_status" class="form-control selectpicker" name="row[order_status]">
                {foreach name="orderStatusList" item="vo" key="k"}
                <option value="{$k|htmlentities}" {if $row.order_status==$k}selected{/if}>{$vo|htmlentities}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="c-points_status" class="control-label col-xs-12 col-sm-2">{:__('Points_status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-points_status" class="form-control selectpicker" name="row[points_status]">
                {foreach name="pointsStatusList" item="vo" key="k"}
                <option value="{$k|htmlentities}" {if $row.points_status==$k}selected{/if}>{$vo|htmlentities}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="c-delivery_content" class="control-label col-xs-12 col-sm-2">{:__('Delivery content')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-delivery_content" class="form-control" name="row[delivery_content]" rows="4">{$row.delivery_content|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label for="c-admin_remark" class="control-label col-xs-12 col-sm-2">管理员备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-admin_remark" class="form-control" name="row[admin_remark]" rows="3">{$row.admin_remark|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
