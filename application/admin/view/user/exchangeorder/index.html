<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        {:build_heading()}
    </div>
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh,del')}
                        <a class="btn btn-success btn-batch-deliver btn-disabled disabled" href="javascript:;"><i class="fa fa-gift"></i> {:__('Deliver')}</a>
                        <a class="btn btn-info btn-batch-ship btn-disabled disabled" href="javascript:;"><i class="fa fa-truck"></i> {:__('Ship')}</a>
                        <a class="btn btn-danger btn-batch-reject btn-disabled disabled" href="javascript:;"><i class="fa fa-ban"></i> {:__('Reject')}</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('user/exchangeorder/edit')}"
                           data-operate-del="{:$auth->check('user/exchangeorder/del')}"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
