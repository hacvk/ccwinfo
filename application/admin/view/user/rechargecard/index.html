<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        {:build_heading()}
    </div>
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh,add,edit,del')}
                        <a class="btn btn-success btn-generate" href="javascript:;"><i class="fa fa-plus-square"></i> {:__('Generate cards')}</a>
                        <a class="btn btn-info btn-export-card" href="javascript:;"><i class="fa fa-download"></i> {:__('Export')}</a>
                        <div class="dropdown btn-group {:$auth->check('user/rechargecard/multi')?'':'hide'}">
                            <a class="btn btn-primary btn-more dropdown-toggle btn-disabled disabled" data-toggle="dropdown"><i class="fa fa-cog"></i> {:__('More')}</a>
                            <ul class="dropdown-menu text-left" role="menu">
                                <li><a class="btn btn-link btn-multi btn-disabled disabled" href="javascript:;" data-params="status=unused"><i class="fa fa-eye"></i> {:__('Set to unused')}</a></li>
                                <li><a class="btn btn-link btn-multi btn-disabled disabled" href="javascript:;" data-params="status=disabled"><i class="fa fa-eye-slash"></i> {:__('Set to disabled')}</a></li>
                            </ul>
                        </div>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('user/rechargecard/edit')}"
                           data-operate-del="{:$auth->check('user/rechargecard/del')}"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
