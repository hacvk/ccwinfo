<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label for="c-card_type" class="control-label col-xs-12 col-sm-2">{:__('Card_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-card_type" class="form-control selectpicker" name="row[card_type]">
                {foreach name="cardTypeList" item="vo" key="k"}
                <option value="{$k|htmlentities}" {if $row.card_type==$k}selected{/if}>{$vo|htmlentities}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="c-card_no" class="control-label col-xs-12 col-sm-2">{:__('Card_no')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-card_no" class="form-control" name="row[card_no]" type="text" value="{$row.card_no|htmlentities}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label for="c-card_secret" class="control-label col-xs-12 col-sm-2">{:__('Card_secret')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-card_secret" data-rule="required" class="form-control" name="row[card_secret]" type="text" value="{$row.card_secret|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-face_amount" class="control-label col-xs-12 col-sm-2">{:__('Face_amount')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-face_amount" class="form-control" name="row[face_amount]" type="number" step="0.01" value="{$row.face_amount|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-bonus_rate" class="control-label col-xs-12 col-sm-2">{:__('Bonus_rate')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-bonus_rate" class="form-control" name="row[bonus_rate]" type="number" step="0.0001" value="{$row.bonus_rate|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-min_recharge" class="control-label col-xs-12 col-sm-2">{:__('Min_recharge')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-min_recharge" class="form-control" name="row[min_recharge]" type="number" step="0.01" value="{$row.min_recharge|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-max_bonus" class="control-label col-xs-12 col-sm-2">{:__('Max_bonus')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-max_bonus" class="form-control" name="row[max_bonus]" type="number" step="0.01" value="{$row.max_bonus|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-batch_no" class="control-label col-xs-12 col-sm-2">{:__('Batch_no')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-batch_no" class="form-control" name="row[batch_no]" type="text" value="{$row.batch_no|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-owner_user_id" class="control-label col-xs-12 col-sm-2">{:__('Owner_user_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-owner_user_id" class="form-control" name="row[owner_user_id]" type="number" value="{$row.owner_user_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-expiretime" class="control-label col-xs-12 col-sm-2">{:__('Expiretime')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-expiretime" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" name="row[expiretime]" type="text" value="{$row.expiretime_text|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', $statusList, $row['status'])}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
