<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        {:build_heading()}
    </div>
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a class="btn btn-success btn-refresh" href="javascript:;"><i class="fa fa-refresh"></i> {:__('Refresh')}</a>
                        <a class="btn btn-primary btn-approve btn-disabled disabled" href="javascript:;"><i class="fa fa-check"></i> {:__('Approve')}</a>
                        <a class="btn btn-danger btn-reject btn-disabled disabled" href="javascript:;"><i class="fa fa-times"></i> {:__('Reject')}</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
