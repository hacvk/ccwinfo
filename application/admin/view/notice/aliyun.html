<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        {:__('阿里云短信配置')}
    </div>
    <div class="panel-body">
        <form id="aliyun-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
            {:token()}
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">{:__('AccessKey ID')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-aliyun_sms_access_key_id" class="form-control" name="row[aliyun_sms_access_key_id]" type="text" value="{$row.aliyun_sms_access_key_id|htmlentities}" placeholder="请输入阿里云 AccessKey ID">
                    <span class="help-block">阿里云短信服务的 AccessKey ID，在<a href="https://ram.console.aliyun.com/manage/ak" target="_blank">阿里云 RAM 控制台</a>获取。</span>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">{:__('AccessKey Secret')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-aliyun_sms_access_key_secret" class="form-control" name="row[aliyun_sms_access_key_secret]" type="password" value="{$row.aliyun_sms_access_key_secret|htmlentities}" placeholder="请输入阿里云 AccessKey Secret">
                    <span class="help-block">阿里云短信服务的 AccessKey Secret，请妥善保管。</span>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">{:__('短信签名')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-aliyun_sms_sign_name" class="form-control" name="row[aliyun_sms_sign_name]" type="text" value="{$row.aliyun_sms_sign_name|htmlentities}" placeholder="请输入短信签名，如：阿里云">
                    <span class="help-block">在<a href="https://dysms.console.aliyun.com/domestic/text/sign" target="_blank">阿里云短信控制台</a>申请并通过审核的短信签名。</span>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">{:__('地域 ID')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-aliyun_sms_region_id" class="form-control" name="row[aliyun_sms_region_id]" type="text" value="{$row.aliyun_sms_region_id|htmlentities}" placeholder="默认为 cn-hangzhou">
                    <span class="help-block">阿里云短信服务地域，一般使用默认的 cn-hangzhou 即可。</span>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">{:__('API Endpoint')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-aliyun_sms_endpoint" class="form-control" name="row[aliyun_sms_endpoint]" type="text" value="{$row.aliyun_sms_endpoint|htmlentities}" placeholder="默认为 dysmsapi.aliyuncs.com">
                    <span class="help-block">阿里云短信 API 端点，一般保持默认即可，无需添加 http:// 或 https:// 前缀。</span>
                </div>
            </div>
            <div class="form-group layer-footer">
                <label class="control-label col-xs-12 col-sm-2"></label>
                <div class="col-xs-12 col-sm-8">
                    <button type="submit" class="btn btn-primary btn-embossed disabled"><i class="fa fa-save"></i> {:__('OK')}</button>
                    <button type="button" class="btn btn-success btn-embossed" id="test-sms-btn"><i class="fa fa-send"></i> 测试短信</button>
                    <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
define(['jquery', 'bootstrap', 'backend', 'table', 'form'], function ($, undefined, Backend, Table, Form) {
    var Controller = {
        aliyun: function () {
            Form.api.bindevent($('#aliyun-form'), function(data, ret) {
                if (ret.code === 1) {
                    Toastr.success(ret.msg);
                }
            });

            $('#test-sms-btn').on('click', function() {
                var data = {
                    aliyun_sms_access_key_id: $('#c-aliyun_sms_access_key_id').val(),
                    aliyun_sms_access_key_secret: $('#c-aliyun_sms_access_key_secret').val(),
                    aliyun_sms_sign_name: $('#c-aliyun_sms_sign_name').val(),
                    aliyun_sms_region_id: $('#c-aliyun_sms_region_id').val() || 'cn-hangzhou',
                    aliyun_sms_endpoint: $('#c-aliyun_sms_endpoint').val() || 'dysmsapi.aliyuncs.com'
                };

                if (!data.aliyun_sms_access_key_id || !data.aliyun_sms_access_key_secret) {
                    Toastr.error('请先填写 AccessKey ID 和 Secret！');
                    return;
                }
                if (!data.aliyun_sms_sign_name) {
                    Toastr.error('请先填写短信签名！');
                    return;
                }

                Layer.prompt({
                    formType: 0,
                    value: '',
                    title: '请输入测试手机号',
                    area: ['300px', '40px']
                }, function(phone, index) {
                    Layer.close(index);

                    if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                        Toastr.error('请输入正确的手机号！');
                        return;
                    }

                    data.phone = phone;
                    $.ajax({
                        url: '{:url("notice/testAliyunSms")}',
                        type: 'POST',
                        data: data,
                        dataType: 'json',
                        success: function(ret) {
                            if (ret.code === 1) {
                                Toastr.success(ret.msg);
                            } else {
                                Toastr.error(ret.msg);
                            }
                        }
                    });
                });
            });
        }
    };
    return Controller;
});
</script>
