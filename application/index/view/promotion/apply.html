<div id="content-container" >
    <div class="row">
        <div class="col-md-9 col-sm-12">
            <div class="panel panel-default modern-card publish-main-card">
                <div class="panel-heading publish-panel-header">
                    <div class="publish-header-content">
                        <div class="publish-header-icon">
                            <i class="fa fa-bullhorn"></i>
                        </div>
                        <div class="publish-header-text">
                            <h3 class="publish-title">申请友情链接</h3>
                            <p class="publish-subtitle">请填写网站信息和联系方式，提交后我们将进行审核并与您确认合作事宜。</p>
                        </div>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="alert alert-info-light">
                        <strong>当前申请位置：</strong>{$slot.name|htmlentities}（编码：{$slot.code|htmlentities}）
                    </div>
                    <form id="promotion-apply-form" class="form-horizontal" role="form" method="POST" action="{:url('promotion/submit')}">
                        {:token()}
                        <input type="hidden" name="slot_id" value="{$slot.id|htmlentities}">
                        <input type="hidden" name="slot_code" value="{$slot.code|htmlentities}">

                        <h4 class="publish-section-title">友情链接信息</h4>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">网站名称<span class="text-danger">*</span></label>
                            <div class="col-sm-10">
                                <input type="text" class="form-control" name="title" maxlength="80" placeholder="请输入您的网站名称" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">网站链接<span class="text-danger">*</span></label>
                            <div class="col-sm-10">
                                <input type="url" class="form-control" name="link_url" placeholder="例如：https://www.example.com" required>
                            </div>
                        </div>

                        <h4 class="publish-section-title">联系信息</h4>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">联系人<span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="contact_name" placeholder="联系人姓名" required>
                            </div>
                            <label class="col-sm-2 control-label">联系电话<span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="contact_mobile" required placeholder="用于与您确认合作详情">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">公司名称</label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="company_name" placeholder="可选">
                            </div>
                            <label class="col-sm-2 control-label">意向金额</label>
                            <div class="col-sm-4">
                                <div class="input-group">
                                    <input type="number" step="0.01" min="0" class="form-control" name="amount" placeholder="可选">
                                    <span class="input-group-addon">元</span>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-10">
                                <button type="submit" class="btn btn-primary">提交申请</button>
                                <a href="{:url('index/index')}" class="btn btn-default">返回首页</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-3 hidden-sm hidden-xs">
            {include file="common/sidenav" /}
        </div>
    </div>
</div>
