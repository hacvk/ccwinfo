<div id="content-container" class="promotion-apply-page">
    <div class="row">
        <div class="col-md-9 col-sm-12">
            <div class="panel panel-default modern-card publish-main-card">
                <div class="panel-heading publish-panel-header">
                    <div class="publish-header-content">
                        <div class="publish-header-icon">
                            <i class="fa fa-bullhorn"></i>
                        </div>
                        <div class="publish-header-text">
                            <h3 class="publish-title">申请推广位</h3>
                            <p class="publish-subtitle">提交申请并完成支付后，后台将进行审核，审核通过后自动开始计时投放。</p>
                        </div>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="alert alert-info-light">
                        <strong>当前展示位：</strong>{$slot.name|htmlentities}（编码：{$slot.code|htmlentities}）
                    </div>
                    <form id="promotion-apply-form" class="form-horizontal" role="form" method="POST" action="{:url('promotion/submit')}">
                        {:token()}
                        <input type="hidden" name="slot_code" id="slot-code" value="{$slot.code|htmlentities}">

                        <div class="form-group">
                            <label class="col-sm-2 control-label">选择展示位</label>
                            <div class="col-sm-10">
                                <select id="slot-selector" class="form-control" data-apply-url="{:url('promotion/apply')}">
                                    {volist name="slotList" id="slotItem"}
                                    <option value="{$slotItem.code|htmlentities}" {if $slotItem.code==$slot.code}selected{/if}>{$slotItem.name|htmlentities}</option>
                                    {/volist}
                                </select>
                            </div>
                        </div>

                        <h4 class="publish-section-title">推广内容</h4>
                        <div id="dynamic-form-fields"></div>

                        <h4 class="publish-section-title">投放周期与价格</h4>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">计费周期<span class="text-danger">*</span></label>
                            <div class="col-sm-10">
                                <div id="billing-cycle-group" class="promotion-cycle-group"></div>
                                <p class="help-block">当前应付：<strong class="text-primary" id="amount-preview">0.00 元</strong></p>
                            </div>
                        </div>
                        <input type="hidden" name="billing_cycle" id="billing-cycle-input" value="week">

                        <h4 class="publish-section-title">联系信息</h4>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">联系人<span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="contact_name" required placeholder="请输入联系人姓名">
                            </div>
                            <label class="col-sm-2 control-label">联系电话<span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="contact_mobile" required placeholder="请输入手机号">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">公司名称</label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="company_name" placeholder="可选">
                            </div>
                            <label class="col-sm-2 control-label">备注</label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="remark" placeholder="可选">
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-10">
                                <button type="submit" class="btn btn-primary" id="submit-apply-btn">提交并创建订单</button>
                                <a href="{:url('index/index')}" class="btn btn-default">返回首页</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-3 hidden-sm hidden-xs">
            {include file="common/sidenav" /}
        </div>
    </div>
</div>

<script>
window.PromotionApplyConfig = {:json_encode($applyConfig, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)};
require(['jquery', '../frontend/js/promotion-apply'], function ($, PromotionApply) {
    if (PromotionApply && PromotionApply.init) {
        PromotionApply.init(window.PromotionApplyConfig || {});
    }
});
</script>
