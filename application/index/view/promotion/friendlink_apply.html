<div id="content-container" class="promotion-apply-page">
    <div class="row">
        <div class="col-md-9 col-sm-12">
            <div class="panel panel-default modern-card publish-main-card">
                <div class="panel-heading publish-panel-header">
                    <div class="publish-header-content">
                        <div class="publish-header-icon">
                            <i class="fa fa-link"></i>
                        </div>
                        <div class="publish-header-text">
                            <h3 class="publish-title">申请友情链接</h3>
                            <p class="publish-subtitle">友情链接申请独立审核，不收取费用。</p>
                        </div>
                    </div>
                </div>
                <div class="panel-body">
                    {if $submitted}
                    <div class="alert alert-success">
                        已提交成功，我们会尽快审核并联系您。
                    </div>
                    {/if}

                    <div class="alert alert-info-light">
                        <strong>申请位置：</strong>{$slot.name|htmlentities}（编码：{$slot.code|htmlentities}）
                    </div>

                    <form id="friendlink-apply-form" class="form-horizontal" role="form" method="POST" action="{:url('promotion/submitFriendlink')}">
                        {:token()}

                        <h4 class="publish-section-title">网站信息</h4>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">网站名称<span class="text-danger">*</span></label>
                            <div class="col-sm-10">
                                <input type="text" class="form-control" name="title" maxlength="80" placeholder="请输入网站名称" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">网站链接<span class="text-danger">*</span></label>
                            <div class="col-sm-10">
                                <input type="url" class="form-control" name="link_url" placeholder="例如：https://www.example.com" required>
                            </div>
                        </div>

                        <h4 class="publish-section-title">联系信息</h4>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">联系人<span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="contact_name" placeholder="联系人姓名" required>
                            </div>
                            <label class="col-sm-2 control-label">联系电话<span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="contact_mobile" placeholder="用于沟通审核" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">公司名称</label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="company_name" placeholder="可选">
                            </div>
                            <label class="col-sm-2 control-label">备注</label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" name="remark" placeholder="可选">
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-10">
                                <button type="submit" class="btn btn-primary">提交友情链接申请</button>
                                <a href="{:url('index/index')}" class="btn btn-default">返回首页</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-3 hidden-sm hidden-xs">
            {include file="common/sidenav" /}
        </div>
    </div>
</div>
