<div class="user-center-page">
    <div class="row">
        <div class="col-md-3">
            {include file="common/sidenav" /}
        </div>
        <div class="col-md-9 col-xs-12">
            <div class="panel panel-default modern-card user-main-card">
                <div class="panel-heading">
                    <h3 class="user-panel-title">绑定账号</h3>
                    <p class="user-panel-subtitle">请先绑定手机号，再完成第三方账号绑定</p>
                </div>
                <div class="panel-body">
                    {if isset($userinfo['avatar'])}
                    <div class="third-profile-preview">
                        <img src="{$userinfo.avatar}" class="third-avatar" alt="">
                        <div class="third-name">{$userinfo.nickname|default=''|htmlentities}</div>
                    </div>
                    {/if}

                    <form name="form" id="bind-form" class="form-vertical third-bind-form" method="POST" action="">
                        {:token()}
                        <input type="hidden" name="platform" value="{$platform|htmlentities}"/>
                        <input type="hidden" name="url" value="{$url|htmlentities}"/>
                        <div class="form-group">
                            <label class="control-label">手机号</label>
                            <div class="controls">
                                <input type="text" id="mobile" name="mobile" data-rule="required" class="form-control">
                                <p class="help-block"></p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label">验证码</label>
                            <div class="controls">
                                <div class="input-group">
                                    <input type="text" name="captcha" class="form-control" data-rule="required;length({$Think.config.captcha.length});digits;remote({:url('api/validate/check_sms_correct')}, event=bind, mobile:#mobile)" />
                                    <span class="input-group-btn" style="padding:0;border:none;">
                                        <a href="javascript:;" class="btn btn-captcha" data-url="{:url('api/sms/send')}" data-type="mobile" data-event="bind">发送验证码</a>
                                    </span>
                                </div>
                                <p class="help-block"></p>
                            </div>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn btn-block third-submit-btn">{:__('确认绑定')}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    require.callback = function () {
        define('frontend/third', ['jquery', 'bootstrap', 'frontend', 'template', 'form'], function ($, undefined, Frontend, Template, Form) {
            var Controller = {
                prepare: function () {
                    var validatoroptions = {
                        invalid: function (form, errors) {
                            $.each(errors, function (i, j) {
                                Layer.msg(j);
                            });
                        }
                    };

                    $("#bind-form").data("validator-options", validatoroptions);

                    Form.api.bindevent($("#bind-form"), function (data, ret) {
                        location.href = ret.url;
                        return false;
                    }, function (data, ret) {

                    });

                }
            };
            return Controller;
        });
    }
</script>
