<div class="user-center-page">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <div class="panel panel-default modern-card user-auth-card">
                <div class="panel-body">
                    <div class="auth-header">
                        <div class="auth-icon">
                            <i class="fa fa-user-plus"></i>
                        </div>
                        <h3 class="auth-title">用户注册</h3>
                        <p class="auth-subtitle">创建新账户，开启您的旅程</p>
                    </div>
                    <div class="user-login-tabs">
                        <a href="{:url('index/user/login')}?url={$url|urlencode|htmlentities}">登录</a>
                        <a class="active">注册</a>
                    </div>
                    <form name="form1" id="register-form" class="form-vertical user-form" method="POST" action="">
                        <input type="hidden" name="invite_user_id" value="0"/>
                        <input type="hidden" name="url" value="{$url|htmlentities}"/>
                        {:token()}
                        <div class="form-group">
                            <label class="control-label">邮箱 <span class="text-muted">(选填)</span></label>
                            <div class="controls">
                                <input type="text" name="email" id="email" data-rule="email" class="form-control" placeholder="选填，用于找回密码">
                                <p class="help-block"></p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label">用户名</label>
                            <div class="controls">
                                <input type="text" id="username" name="username" data-rule="required;length:2~30" class="form-control" placeholder="2-30个字符，支持中文英文数字">
                                <p class="help-block"></p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label">密码</label>
                            <div class="controls">
                                <input type="password" id="password" name="password" data-rule="required;password" class="form-control" placeholder="6-30个字符">
                                <p class="help-block"></p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label">手机号</label>
                            <div class="controls">
                                <input type="text" id="mobile" name="mobile" data-rule="required;mobile" class="form-control" placeholder="请输入手机号">
                                <p class="help-block"></p>
                            </div>
                        </div>

                        {if $captchaType}
                        <div class="form-group">
                            <label class="control-label">验证码</label>
                            <div class="controls">
                                <div class="input-group">
                                    {include file="common/captcha" event="register" type="$captchaType" /}
                                </div>
                                <p class="help-block"></p>
                            </div>
                        </div>
                        {/if}

                        <div class="form-group normal-footer">
                            <button type="submit" class="btn btn-primary btn-lg btn-block">
                                <i class="fa fa-user-plus"></i> 注册
                            </button>
                            <a href="{:url('index/user/login')}?url={$url|urlencode|htmlentities}" class="btn btn-default btn-lg btn-block">
                                已有账号？立即登录
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
.user-auth-card {
    border: none;
    box-shadow: 0 8px 40px rgba(31, 76, 126, 0.1);
    border-radius: 16px;
    overflow: hidden;
}
.user-auth-card .panel-body {
    padding: 40px 45px;
}
.auth-header {
    text-align: center;
    margin-bottom: 30px;
}
.auth-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #008cd7 0%, #00a8e8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0, 140, 215, 0.25);
}
.auth-icon i {
    font-size: 36px;
    color: #fff;
}
.auth-title {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 600;
    color: #2c3e50;
}
.auth-subtitle {
    margin: 0;
    font-size: 14px;
    color: #8ea0b1;
}
.user-login-tabs {
    margin-bottom: 28px;
    border-bottom: 2px solid #e8f0f7;
    text-align: center;
}
.user-login-tabs a {
    display: inline-block;
    padding: 12px 30px;
    color: #7d90a2;
    font-size: 16px;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all 0.3s ease;
}
.user-login-tabs a:hover {
    color: #008cd7;
    text-decoration: none;
}
.user-login-tabs a.active {
    color: #008cd7;
    border-bottom-color: #008cd7;
}
.user-form .form-control {
    height: 46px;
    border: 1px solid #dce6ef;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
    box-shadow: none;
    transition: all 0.22s ease;
}
.user-form .form-control:focus {
    border-color: #0093df;
    box-shadow: 0 0 0 3px rgba(0, 140, 215, 0.12);
}
.user-form .control-label {
    color: #6f8498;
    font-weight: 600;
    margin-bottom: 8px;
}
.normal-footer {
    margin-top: 30px;
}
.normal-footer .btn {
    border-radius: 8px;
    padding: 12px 20px;
    font-weight: 600;
    font-size: 16px;
}
.normal-footer .btn-primary {
    border: 0;
    background: linear-gradient(135deg, #008cd7, #0077b8);
    box-shadow: 0 8px 18px rgba(0, 140, 215, 0.24);
}
.normal-footer .btn-primary:hover {
    background: linear-gradient(135deg, #0a9fe8, #008cd7);
}
.normal-footer .btn-default {
    color: #5d6c7c;
    border: 1px solid #d7e2ec;
    background: #f8fbff;
    margin-top: 12px;
}
.normal-footer .btn-default:hover {
    color: #40586f;
    background: #f1f7fd;
}
@media (max-width: 767px) {
    .user-auth-card .panel-body {
        padding: 30px 20px;
    }
    .auth-icon {
        width: 60px;
        height: 60px;
    }
    .auth-icon i {
        font-size: 28px;
    }
    .auth-title {
        font-size: 20px;
    }
    .user-login-tabs a {
        padding: 10px 20px;
        font-size: 14px;
    }
    .user-form .form-control {
        height: 42px;
    }
    .normal-footer .btn {
        padding: 10px 16px;
        font-size: 15px;
    }
}
</style>
