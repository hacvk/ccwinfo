<div class="guide-subnav-wrap">
    <div class="guide-subnav-inner">
        {if !empty($guideSubnavCategories)}
        {volist name='guideSubnavCategories' id='cat'}
        <a href="{:guide_category_url($cat)}" class="guide-subnav-item {if isset($guideCurrentTopCategoryId) && $guideCurrentTopCategoryId==$cat.id}active{/if}">{$cat.name|htmlentities}</a>
        {/volist}
        {/if}
        <a href="{:url('/guide/category')}" class="guide-subnav-item guide-subnav-more {if !empty($guideSubnavMoreActive)}active{/if}">更多</a>
    </div>
</div>
