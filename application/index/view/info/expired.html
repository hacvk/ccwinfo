<style>
.expired-page {
    max-width: 780px;
    margin: 30px auto 40px;
}

.expired-card {
    background: #fff;
    border: 1px solid #e9edf3;
    border-radius: 10px;
    padding: 38px 26px 30px;
    text-align: center;
}

.expired-icon {
    width: 68px;
    height: 68px;
    line-height: 68px;
    margin: 0 auto 14px;
    border-radius: 50%;
    font-size: 32px;
    color: #d9534f;
    background: #fff0f0;
}

.expired-title {
    margin: 0 0 10px;
    font-size: 26px;
    color: #30394a;
}

.expired-desc {
    margin: 0 auto;
    max-width: 560px;
    font-size: 15px;
    line-height: 1.7;
    color: #5a6474;
}

.expired-meta {
    margin: 14px 0 0;
    font-size: 13px;
    color: #8b95a6;
}

.expired-actions {
    margin-top: 24px;
}

.expired-actions .btn {
    margin: 0 5px 8px;
    min-width: 120px;
}
</style>

<div class="expired-page">
    <div class="expired-card">
        <div class="expired-icon">
            <span class="glyphicon glyphicon-time"></span>
        </div>
        <h1 class="expired-title">{$noticeTitle|default='信息已过期下架'}</h1>
        <p class="expired-desc">{$noticeDesc|default='该信息已超过有效期，暂不对外展示。'}</p>
        {if !empty($infoId)}
        <p class="expired-meta">信息编号：{$infoId}</p>
        {/if}
        <div class="expired-actions">
            <a href="{:url('info/lists')}" class="btn btn-primary">返回列表</a>
            <a href="{:url('/')}" class="btn btn-default">回到首页</a>
        </div>
    </div>
</div>
