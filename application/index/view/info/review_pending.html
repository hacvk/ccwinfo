<style>
.review-pending-page {
    max-width: 780px;
    margin: 30px auto 40px;
}

.review-pending-card {
    background: #fff;
    border: 1px solid #e9edf3;
    border-radius: 10px;
    padding: 38px 26px 30px;
    text-align: center;
}

.review-pending-icon {
    width: 68px;
    height: 68px;
    line-height: 68px;
    margin: 0 auto 14px;
    border-radius: 50%;
    font-size: 32px;
    color: #f0ad4e;
    background: #fff6e8;
}

.review-pending-title {
    margin: 0 0 10px;
    font-size: 26px;
    color: #30394a;
}

.review-pending-desc {
    margin: 0 auto;
    max-width: 560px;
    font-size: 15px;
    line-height: 1.7;
    color: #5a6474;
}

.review-pending-meta {
    margin: 14px 0 0;
    font-size: 13px;
    color: #8b95a6;
}

.review-pending-actions {
    margin-top: 24px;
}

.review-pending-actions .btn {
    margin: 0 5px 8px;
    min-width: 120px;
}
</style>

<div class="review-pending-page">
    <div class="review-pending-card">
        <div class="review-pending-icon">
            <span class="glyphicon glyphicon-time"></span>
        </div>
        <h1 class="review-pending-title">{$noticeTitle|default='发布成功，等待审核'}</h1>
        <p class="review-pending-desc">{$noticeDesc|default='你提交的内容正在审核中，审核通过后会自动展示在前台。'}</p>
        {if !empty($infoId)}
        <p class="review-pending-meta">信息编号：{$infoId}</p>
        {/if}

        <div class="review-pending-actions">
            <a href="{:url('info/publish_select')}" class="btn btn-primary">继续发布</a>
            <a href="{:url('info/lists')}" class="btn btn-default">查看列表</a>
            <a href="{:url('/')}" class="btn btn-link">返回首页</a>
        </div>
    </div>
</div>
