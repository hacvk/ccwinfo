<div class="info-manage-page">
    <div class="modern-card info-manage-card">
        <div class="manage-head">
            <h3 class="manage-title"><span class="glyphicon glyphicon-search"></span> 查找/修改/撤销信息</h3>
            <p class="manage-subtitle">请输入发布时验证的手机号，仅检索当前“已发布”信息。</p>
        </div>

        <form id="info-manage-search-form" class="manage-search-form">
            <div class="form-group">
                <label for="manage-phone">手机号</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="manage-phone" maxlength="11" placeholder="请输入手机号">
                    <span class="input-group-btn">
                        <button type="submit" class="btn btn-primary" id="manage-search-btn">立即检索</button>
                    </span>
                </div>
            </div>
        </form>

        <div class="manage-tip">
            <span class="glyphicon glyphicon-info-sign"></span>
            游客发布信息请使用预留密码管理；注册账号发布信息请登录后管理。
        </div>

        <div id="manage-result-empty" class="manage-empty">
            <span class="glyphicon glyphicon-list-alt"></span>
            <p>请输入手机号后开始检索</p>
        </div>

        <div id="manage-result-list" class="manage-result-list"></div>
    </div>

    <div class="modal fade" id="manage-password-modal" tabindex="-1" role="dialog" aria-labelledby="managePasswordTitle">
        <div class="modal-dialog modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span>&times;</span></button>
                    <h4 class="modal-title" id="managePasswordTitle">请输入预留密码</h4>
                </div>
                <div class="modal-body">
                    <form id="manage-password-form">
                        <input type="hidden" id="manage-action-type" value="">
                        <input type="hidden" id="manage-info-id" value="0">
                        <input type="hidden" id="manage-action-phone" value="">
                        <div class="form-group">
                            <label for="manage-password">预留密码</label>
                            <input type="password" class="form-control" id="manage-password" maxlength="64" placeholder="请输入发布时设置的预留密码">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block" id="manage-password-submit">确认</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
require(['jquery', '__CDN__/assets/frontend/js/info-manage.js?v={$Think.config.site.version|htmlentities}'], function () {
    window.InfoManageConfig = {$jsConfig};
    window.InfoManage.init();
});
</script>
